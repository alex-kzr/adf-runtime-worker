name: Worker checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.12.9
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps .
      - name: Prepare pinned public Node and native fixtures (no model execution)
        run: |
          node_archive="$RUNNER_TEMP/node-v24.21.0-linux-x64.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$node_archive" https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz
          echo "fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6  $node_archive" | sha256sum --check --strict
          tar --extract --xz --file "$node_archive" --directory "$RUNNER_TEMP" --no-same-owner
          node="$RUNNER_TEMP/node-v24.21.0-linux-x64/bin/node"
          echo "7fde7b8afa198da66257f42ee2001d874c7355631e6d1579a5fb5ef1f246df4c  $node" | sha256sum --check --strict
          echo "ADF_TEST_NODE_PATH=$node" >> "$GITHUB_ENV"
          echo "ADF_TEST_CODEX_PACKAGE=$RUNNER_TEMP/adf-codex-fixture/node_modules/@openai/codex" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/adf-codex-fixture" --ignore-scripts --no-audit --no-fund @openai/codex@0.157.0
          launcher="$RUNNER_TEMP/adf-codex-fixture/node_modules/@openai/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/codex-resources/bwrap"
          if ! test -x "$launcher"; then
            launcher="$RUNNER_TEMP/adf-codex-fixture/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/codex-resources/bwrap"
          fi
          test -x "$launcher"
          echo "77360cb751ccedc5971391444ac86a8a33c15b04d6b4a6fe45f5d25496e62c4c  $launcher" | sha256sum --check --strict
          echo "ADF_TEST_BWRAP_PATH=$launcher" >> "$GITHUB_ENV"
          codex="$(dirname "$(dirname "$launcher")")/bin/codex"
          echo "1a822376d4634ac32dddc030e5117c63359f7f8cd4b1b64382c68190287d0258  $codex" | sha256sum --check --strict
          echo "ADF_TEST_CODEX_PATH=$codex" >> "$GITHUB_ENV"
      - run: ruff check src tests
      - run: mypy src
      - run: bandit -r src -ll
      - run: python -m pytest -q
